# Deploys the Edge Functions to the MJM Intranet Supabase project from GitHub —
# no terminal needed.
#
# One-time setup: add a repository secret named SUPABASE_ACCESS_TOKEN
# (Supabase → your avatar → Account preferences → Access Tokens → Generate;
# the same token as the Machinery Portal repo works).
#
# Runs automatically when a function changes on main, or by hand:
# Actions → "Deploy Edge Functions" → Run workflow.
# Function secrets (GW_TOKEN_PRIVATE_JWK, …) stay in Supabase → Edge Functions → Secrets.

name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/functions.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: intranet-functions-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: briqzyxfxsvulyizzbiu
    steps:
      - uses: actions/checkout@v4

      - name: Check setup
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret first (Settings → Secrets and variables → Actions)."
              exit 1
            fi
            echo "::warning::SUPABASE_ACCESS_TOKEN secret not set yet — functions not deployed. Add it, then Run workflow."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.skip != 'true'
        with:
          version: latest

      - name: Deploy functions
        if: steps.check.outputs.skip != 'true'
        run: |
          for fn in gw-auth gw-admin gw-issue-token gw-check-access gw-jwks gw-master-data gw-mcp gw-ai-chat; do
            echo "::group::$fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt --yes
            echo "::endgroup::"
          done
          echo "### Edge Functions deployed to $PROJECT_REF" >> "$GITHUB_STEP_SUMMARY"
