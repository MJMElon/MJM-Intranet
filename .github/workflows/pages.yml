# 推送到 main 后，先编译样式（shared/app.css），再把 repo 根目录发布到 GitHub Pages
# Pages 设定为「GitHub Actions」时由这个流程发布；设定为「从分支发布」时 GitHub 会直接发布分支内容
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 样式事先编译（取代浏览器里的 Tailwind），确保发布的 app.css 一定是最新的
      - run: npm ci
      - run: npm run build:css
      # 每次发布的版本号（commit 前 8 码）：网页引用的 js / css 都带 ?v=…，浏览器才不会一直用旧的
      - run: grep -rlF "__GW_VERSION__" --include=*.html --include=*.js . | grep -v node_modules | xargs -r sed -i "s/__GW_VERSION__/${GITHUB_SHA::8}/g"
      # 每个网页加上安全政策（只准载入自己网站的脚本；资料只能送到自己的 Supabase）：要在上面换好版本号之后才算指纹
      - run: node scripts/csp.mjs .
      # 检查：每个网页都一定要有安全政策，少了就不发布
      - run: |
          missing=$(grep -rL --include=*.html "Content-Security-Policy" . --exclude-dir=node_modules --exclude-dir=.git || true)
          if [ -n "$missing" ]; then echo "::error::Missing Content-Security-Policy in: $missing"; exit 1; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # GitHub 有时刚上传完还「找不到」档案（它那边慢了）：等一下再试，最多试三次
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: sleep 120
      - if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v4
