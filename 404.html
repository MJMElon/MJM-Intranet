<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MJM Intranet</title>
<script>
/* 找不到的网址：…/admin、…/login 这种不带 .html 的 → 那一页（? 和 # 照留）；其他 → 首页。
   首页：github.io 旧网址在 /MJM-Intranet/ 底下，自己的网域在最上层 */
(function () {
  var root = /github\.io$/.test(location.hostname) ? "/MJM-Intranet/" : "/";
  // 一定留在本站：开头的多个 / 合成一个（//evil.com/login 不会跳到别的网站）
  var path = "/" + location.pathname.replace(/^\/+/, "").replace(/\/+$/, "");
  var name = path.split("/").pop();
  if (["admin", "login", "settings", "library", "index"].indexOf(name) >= 0) {
    location.replace(path + ".html" + location.search + location.hash);
  } else {
    location.replace(root);
  }
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=/"></noscript>
</head>
<body></body>
</html>
