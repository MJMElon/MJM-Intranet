    <linearGradient id="y" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde047"/><stop offset="1" stop-color="#eab308"/></linearGradient>
  </defs>
  <rect width="128" height="128" rx="26" fill="#ffffff"/>
