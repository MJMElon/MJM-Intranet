<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- a long droplet lying on its side: tip at (0,0) pointing right, oval end to the left -->
    <path id="drop" d="M0 0 C-7 -7 -18 -33 -37 -33 A26 33 0 1 0 -37 33 C-18 33 -7 7 0 0 Z"/>
    <linearGradient id="green" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#3a9a62"/>
      <stop offset="1" stop-color="#0b4a2b"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#e2590a"/>
    </linearGradient>
  </defs>
  <!-- left: oil palm green; right: CPO orange; tips meet in the middle -->
  <use href="#drop" transform="translate(64 64)" fill="url(#green)"/>
  <use href="#drop" transform="translate(64 64) scale(-1 1)" fill="url(#orange)"/>
  <!-- shine on the oil drop -->
  <path d="M104 43 C114 48 118 59 116 71" fill="none" stroke="#fff" stroke-opacity="0.85" stroke-width="4.5" stroke-linecap="round"/>
</svg>
