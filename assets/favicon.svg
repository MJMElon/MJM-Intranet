<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- a long droplet lying on its side: tip at (0,0) pointing right, round end to the left -->
    <path id="drop" d="M0 0 C-9 -3 -21 -23 -40 -23 A23 23 0 1 0 -40 23 C-21 23 -9 3 0 0 Z"/>
    <linearGradient id="green" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#3a9a62"/>
      <stop offset="1" stop-color="#0b4a2b"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#e2590a"/>
    </linearGradient>
  </defs>
  <!-- left: oil palm green -->
  <use href="#drop" transform="translate(64 64)" fill="url(#green)"/>
  <!-- right: CPO orange -->
  <use href="#drop" transform="translate(64 64) scale(-1 1)" fill="url(#orange)"/>
  <!-- shine on both -->
  <path d="M22 51 C14 55 11 63 13 71" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round"/>
  <path d="M106 51 C114 55 117 63 115 71" fill="none" stroke="#fff" stroke-opacity="0.85" stroke-width="4" stroke-linecap="round"/>
</svg>
