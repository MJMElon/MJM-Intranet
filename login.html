<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="assets/favicon.ico?v=blocks4" sizes="any">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=blocks4">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=blocks4">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png?v=blocks4">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=blocks4">
<title>MJM Intranet</title>
<script src="shared/head.js?v=__GW_VERSION__"></script>
<style>
  /* 登录封面：白底，MJM 字标（assets/mjm-logo）。
     进页面：字标从很远的地方（很小、模糊）加速冲到前面 → 正后面浮出一个比 MJM 大、淡淡、像影子的「Intranet」
             （两个字都在画面正中间、字底对齐，Intranet 高出来的部分在 MJM 上面看得到；停好之后不再有任何效果）→ 出现白色玻璃方框。
     按「用 OPIS PRO 登录」：方框退下 → 字标冲到眼前盖满整个画面 → 直接在同一个分页打开 OPIS PRO。 */
  :root { --frame: #1f2933; --frame-deep: #0f172a; }
  html, body { background: #ffffff !important; color: #0f172a; }
  body { overflow-x: hidden; }
  .stage {
    min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6vh 16px;
    background: radial-gradient(ellipse 70% 45% at 50% 38%, #f3f5f8 0%, #ffffff 70%);
  }

  /* MJM 字标 + 正后面的影子字「Intranet」（叠在一起，都在正中间，字底对齐） */
  .mark { position: relative; display: flex; align-items: center; justify-content: center; }
  .mark-float { position: relative; z-index: 3; }
  /* MJM 后面一圈柔和的白光：Intranet 靠近 MJM 的地方淡掉，不会从 M、J、M 中间的缝透出来，看起来干净 */
  .mark-float::before {
    content: ""; position: absolute; z-index: -1; left: -14%; right: -14%; top: -2%; bottom: -8%; pointer-events: none;
    background: radial-gradient(closest-side, #ffffff 62%, rgba(255, 255, 255, .85) 78%, rgba(255, 255, 255, 0) 100%);
  }
  /* MJM 字标图档（背景透明） */
  .logo { position: relative; display: block; width: min(44vw, 490px); margin: -17px 0 -21px; opacity: 0; transform: scale(.02); will-change: transform, opacity, filter; }
  .logo img { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
  /* 从远处：一开始很慢（远），越来越快冲过来，稍微冲过头再停好 */
  @keyframes approach {
    0% { opacity: 0; transform: scale(.02); filter: blur(6px); animation-timing-function: cubic-bezier(.7, 0, .84, .3); }
    14% { opacity: .85; }
    80% { opacity: 1; transform: scale(1.08); filter: blur(0); animation-timing-function: cubic-bezier(.2, .8, .3, 1); }
    100% { opacity: 1; transform: scale(1); filter: blur(0); }
  }
  .ready .logo { animation: approach 1.15s forwards; }

  /* 影子字：比 MJM 大、很淡、有点模糊，在 MJM 正后面慢慢浮现。
     上下位置由下面的脚本算：让 Intranet 的字底刚好对齐 MJM 的字底（top 先给个大概值） */
  .ghost-wrap { position: absolute; left: 50%; top: -40%; z-index: 1; translate: -50% 0; pointer-events: none; }
  .ghost {
    display: block; white-space: nowrap; user-select: none; transform-origin: 50% 85%;
    font: 800 min(25vw, 398px)/1 "Segoe UI", "SF Pro Display", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    letter-spacing: -.035em; color: rgba(51, 65, 85, .11);
    filter: blur(1px);
    opacity: 0; transform: scale(.8);
  }
  @keyframes ghost-in {
    0% { opacity: 0; transform: scale(.8); filter: blur(12px); }
    100% { opacity: 1; transform: none; filter: blur(1px); }
  }
  .ready .ghost { animation: ghost-in .8s cubic-bezier(.2, .8, .2, 1) .95s forwards; }

  /* 登录：MJM 冲到眼前盖满画面（以 J 为中心放大），Intranet 往两边散开，接着画面全部盖上 → 打开 OPIS PRO */
  @keyframes rush { from { opacity: 1; transform: scale(1); filter: blur(0); } to { opacity: 1; transform: scale(34); filter: blur(3px); } }
  .stage.leaving .logo { transform-origin: 52% 42%; animation: rush .75s cubic-bezier(.55, 0, .9, .25) forwards; }
  @keyframes ghost-out { from { opacity: 1; transform: none; } to { opacity: 0; transform: scale(2.4); filter: blur(8px); } }
  .stage.leaving .ghost { animation: ghost-out .4s ease-in forwards; }
  .stage.leaving .rule { opacity: 0; transition: opacity .2s; }
  .stage.leaving .glass { opacity: 0; transform: translateY(46px) scale(.94); transition: opacity .25s, transform .35s ease-in; }
  /* 和字标同色的整片画面：确保冲进去之后整个画面都盖住 */
  .warp {
    position: fixed; inset: 0; z-index: 50; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at 50% 45%, #4a5868 0%, #2a3441 55%, #1c232c 100%);
  }
  .warp.on { opacity: 1; transition: opacity .3s ease-in .4s; }
  /* 电脑：OPIS PRO 在一个小视窗里登录（像 Google），后面的页面变暗，中间一张小卡片 */
  .sso-wait {
    position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: rgba(15, 23, 42, .38); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    animation: wait-in .25s ease both;
  }
  @keyframes wait-in { from { opacity: 0; } to { opacity: 1; } }
  .sso-wait .card {
    width: min(92vw, 340px); padding: 22px; border-radius: 18px; background: #fff; text-align: center;
    box-shadow: 0 24px 60px rgba(15, 23, 42, .3); color: #0f172a;
  }
  .sso-wait .spin { width: 26px; height: 26px; margin: 0 auto 12px; border-radius: 999px; border: 3px solid #e2e8f0; border-top-color: #1f2933; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sso-wait p { font-size: 14px; color: #334155; }
  .sso-wait .row { display: flex; gap: 8px; margin-top: 16px; }
  .sso-wait button { flex: 1; height: 38px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .sso-wait .show { border: 0; color: #fff; background: linear-gradient(180deg, #3a4651, #1f2933); }
  .sso-wait .stop { border: 1px solid rgba(15, 23, 42, .16); background: #fff; color: #0f172a; }
  /* 从 OPIS PRO 回来换登录的那一下：整页留白，不播字标（登录失败才显示） */
  .sso-return .stage, .sso-return .warp { visibility: hidden; }
  .rule { width: clamp(120px, 28vw, 260px); height: 1px; margin: 18px 0 0; background: linear-gradient(90deg, transparent, #9aa4ae, transparent); opacity: 0; transition: opacity .6s 1.1s; }
  .ready .rule { opacity: 1; }

  /* 白色玻璃方框 */
  .glass {
    position: relative; z-index: 2; width: min(92vw, 360px); margin-top: 22px;
    padding: 22px; border-radius: 22px;
    background: linear-gradient(180deg, rgba(255, 255, 255, .78), rgba(255, 255, 255, .58));
    -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid rgba(255, 255, 255, .95);
    box-shadow: 0 1px 0 #ffffff inset, 0 0 0 1px rgba(148, 160, 172, .25), 0 24px 50px rgba(15, 23, 42, .12);
    opacity: 0; transform: translateY(24px) scale(.97);
    transition: opacity .6s, transform .7s cubic-bezier(.2, .8, .2, 1);
  }
  .show-glass .glass { opacity: 1; transform: none; }
  .glass label > span { display: block; font-size: 12px; font-weight: 600; color: #334155; margin-bottom: 6px; }
  .glass input {
    width: 100%; height: 44px; border-radius: 12px; border: 1px solid rgba(15, 23, 42, .14); background: rgba(255, 255, 255, .9);
    padding: 0 14px; font-size: 15px; color: #0f172a; outline: none; transition: border-color .2s, box-shadow .2s;
  }
  .glass input:focus { border-color: #64707c; box-shadow: 0 0 0 3px rgba(100, 112, 124, .18); }
  .glass .go {
    width: 100%; height: 46px; border: 0; border-radius: 12px; cursor: pointer; color: #fff; font-weight: 600; font-size: 15px; letter-spacing: .02em;
    background: linear-gradient(180deg, #3a4651, #1f2933); box-shadow: 0 1px 0 rgba(255, 255, 255, .18) inset, 0 6px 14px rgba(15, 23, 42, .2);
    transition: filter .2s;
  }
  .glass .go:hover { filter: brightness(1.12); }
  .glass .go:disabled { opacity: .7; cursor: default; }
  .glass .link { font-size: 13px; color: #475569; background: none; border: 0; cursor: pointer; }
  .glass .link:hover { text-decoration: underline; text-underline-offset: 3px; }
  .glass .sso {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 46px; border-radius: 12px; text-decoration: none;
    font-weight: 600; font-size: 15px; color: #0f172a; background: rgba(255, 255, 255, .92); border: 1px solid rgba(15, 23, 42, .16);
    box-shadow: 0 1px 2px rgba(15, 23, 42, .06); transition: border-color .2s, box-shadow .2s, transform .15s;
  }
  .glass .sso:hover { border-color: #64707c; box-shadow: 0 6px 14px rgba(15, 23, 42, .12); transform: translateY(-1px); }
  .glass .sso:active { transform: none; }
  .glass .or { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #94a3b8; }
  .glass .or::before, .glass .or::after { content: ""; flex: 1; height: 1px; background: rgba(15, 23, 42, .12); }

  @media (prefers-reduced-motion: reduce) {
    .logo { opacity: 1; transform: none; }
    .ghost { opacity: 1; transform: none; }
    .ready .logo, .stage.leaving .logo, .ready .ghost, .stage.leaving .ghost { animation: none; }
    .glass, .rule { transition: none; }
  }
</style>
</head>
<body>
<main class="stage" id="stage">
  <h1 class="mark">
    <span class="mark-float">
      <picture class="logo">
        <source srcset="assets/mjm-logo.webp" type="image/webp">
        <img src="assets/mjm-logo.png" alt="MJM" width="1333" height="628" draggable="false">
      </picture>
    </span>
    <span class="ghost-wrap"><span class="ghost">Intranet</span></span>
  </h1>
  <div class="rule"></div>
  <div class="glass" id="glass">
    <div id="card"></div>
  </div>
</main>
<div class="warp" id="warp" aria-hidden="true"></div>

<script>
/* 字标图片载入后才开始飞进来；载入失败也照常显示 */
(function () {
  const stage = document.getElementById("stage");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let started = false;
  const start = () => {
    if (started) return;
    started = true;
    requestAnimationFrame(() => stage.classList.add("ready"));
    setTimeout(() => stage.classList.add("show-glass"), reduce ? 0 : 1500);
  };
  const img = document.querySelector(".logo img");
  // Intranet 的字底（baseline）放在 MJM 字母的底部（字母底部约在图档高度的 70.5%）
  const ghost = document.querySelector(".ghost");
  const place = () => {
    const cs = getComputedStyle(ghost);
    const F = parseFloat(cs.fontSize);
    let below = 0.22 * F; // 量不到字型资料时的大概值：baseline 到字框底部的距离
    try {
      const c = document.createElement("canvas").getContext("2d");
      c.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
      const m = c.measureText("Intranet");
      if (m.fontBoundingBoxAscent) below = m.fontBoundingBoxDescent + (F - m.fontBoundingBoxAscent - m.fontBoundingBoxDescent) / 2;
    } catch (e) {}
    const logo = document.querySelector(".logo");
    const letterBottom = logo.parentElement.offsetTop + logo.offsetTop + img.offsetHeight * 0.705;
    ghost.parentElement.style.top = letterBottom - (F - below) + "px";
  };
  place();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(place);
  img.addEventListener("load", place);
  addEventListener("resize", place);
  const loaded = img.complete ? Promise.resolve() : new Promise((r) => img.addEventListener("load", r, { once: true }));
  // 从 OPIS PRO 回来：先不播，登录失败（回到登录画面）才播
  window.gwIntro = () => {
    document.documentElement.classList.remove("sso-return");
    Promise.race([loaded, new Promise((r) => setTimeout(r, 1500))]).then(start, start);
  };
  const q = new URLSearchParams(location.search);
  if (q.get("mode") === "sso" || q.get("popup")) document.documentElement.classList.add("sso-return");
  else window.gwIntro();
})();
</script>

<script>
/* ---------------------------------------------------------------- 登录 / 忘记密码 / 改密码 */
const { sb, t, esc, $, invoke, go } = GW;
document.documentElement.classList.remove("dark"); // 封面固定白底
const params = new URLSearchParams(location.search);
const card = $("#card");

const field = (label, input) => `<label class="block"><span>${esc(label)}</span>${input}</label>`;
// 登入后要去的页面：只接受 Intranet 自己的页面
const nextPage = () => {
  const n = params.get("next") || "";
  return /^[a-z0-9-]+\.html(\?[\w=&.%-]*)?(#[\w-]*)?$/.test(n) && !n.startsWith("login.html") ? n : "index.html";
};
// OPIS PRO 回来：用一次性登录码换 session（码在 # 后面，先从网址拿掉）
async function finishSso() {
  const h = new URLSearchParams(location.hash.slice(1));
  const th = h.get("th");
  const next = h.get("next");
  history.replaceState(null, "", location.pathname);
  const failed = () => (window.gwIntro(), showLogin(t("login.errors.ssoExpired")));
  if (!th) return failed();
  let r = await sb.auth.verifyOtp({ token_hash: th, type: "magiclink" });
  if (r.error) r = await sb.auth.verifyOtp({ token_hash: th, type: "email" });
  if (r.error || !r.data || !r.data.session) {
    if (POPUP_ID) return popupDone({ error: "sso_expired" });
    return failed();
  }
  try { localStorage.setItem("gw-sso", r.data.session.user.id); } catch (e) {}
  if (next) params.set("next", next);
  if (POPUP_ID) return popupDone({ ok: true, next: nextPage() });
  try { sessionStorage.setItem("gw-welcome", "1"); } catch (e) {}
  go(nextPage());
}

// ---------------- 电脑：OPIS PRO 在小视窗里登录（像 Google）；手机或视窗被挡住：照旧在这个分页打开
// 小视窗登录完成：session 已经存在这个网站，用 BroadcastChannel + window.opener 只通知「成功 + 要去的页面」或「错误代号」
const POPUP_ID = /^[A-Za-z0-9_-]{8,64}$/.test(params.get("popup") || "") ? params.get("popup") : "";
function popupDone(msg) {
  const m = { type: "gw-sso", popup: POPUP_ID, ...msg };
  try { const ch = new BroadcastChannel("gw-sso"); ch.postMessage(m); ch.close(); } catch (e) {}
  try { if (window.opener && window.opener !== window) window.opener.postMessage(m, location.origin); } catch (e) {}
  setTimeout(() => window.close(), 100);
  // 关不掉（例如原本的页面已经关了）：就在这个视窗照常继续
  setTimeout(() => {
    if (window.closed) return;
    if (msg.ok) {
      try { sessionStorage.setItem("gw-welcome", "1"); } catch (e) {}
      return go(nextPage());
    }
    window.gwIntro();
    showLogin(SSO_ERRORS[msg.error] ? t("login.errors." + SSO_ERRORS[msg.error]) : t("login.errors.ssoFailed"), msg.error === "pending" ? "warn" : undefined);
  }, 700);
}
function ssoWindow(href) {
  const desktop = matchMedia("(pointer: fine)").matches && window.innerWidth >= 640;
  if (!desktop) return false;
  const id = Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => b.toString(16).padStart(2, "0")).join("");
  const W = 480, H = 640;
  const left = Math.max(0, Math.round(window.screenX + (window.outerWidth - W) / 2));
  const top = Math.max(0, Math.round(window.screenY + (window.outerHeight - H) / 2));
  // 一定要在点击当下开（不能先 await），浏览器才不会挡
  const w = window.open(href + "&popup=" + id, "gw-opispro", `popup=yes,width=${W},height=${H},left=${left},top=${top}`);
  if (!w) return false;
  const wait = document.createElement("div");
  wait.className = "sso-wait";
  wait.innerHTML = `<div class="card" role="dialog" aria-live="polite"><div class="spin"></div><p>${esc(t("login.ssoWaiting"))}</p>
    <div class="row"><button type="button" class="stop">${esc(t("login.ssoStop"))}</button><button type="button" class="show">${esc(t("login.ssoShow"))}</button></div></div>`;
  document.body.appendChild(wait);
  // done = 已经有结果（或按了取消）。视窗看起来关了只拿掉暗色画面、继续等讯息：
  // 有些登录网站会切断两个视窗的连结，这时 w.closed 会提早变成 true，但登录其实还在进行
  let done = false;
  let ch = null;
  const hideWait = () => {
    clearInterval(timer);
    wait.remove();
  };
  const end = () => {
    done = true;
    hideWait();
    window.removeEventListener("message", onMsg);
    try { ch && ch.close(); } catch (x) {}
  };
  const finish = (m) => {
    if (done || !m || m.type !== "gw-sso" || m.popup !== id) return;
    end();
    try { w.close(); } catch (x) {}
    if (m.ok) {
      if (m.next) params.set("next", m.next);
      try { sessionStorage.setItem("gw-welcome", "1"); } catch (x) {}
      // 登录好了：MJM 冲到眼前盖满画面，再进主页
      const stage = document.getElementById("stage");
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return go(nextPage());
      stage.classList.add("leaving");
      document.getElementById("warp").classList.add("on");
      return setTimeout(() => go(nextPage()), 760);
    }
    showLogin(SSO_ERRORS[m.error] ? t("login.errors." + SSO_ERRORS[m.error]) : t("login.errors.ssoFailed"), m.error === "pending" ? "warn" : undefined);
  };
  const onMsg = (ev) => {
    if (ev.origin !== location.origin || ev.source !== w) return;
    finish(ev.data);
  };
  window.addEventListener("message", onMsg);
  try { ch = new BroadcastChannel("gw-sso"); ch.onmessage = (ev) => finish(ev.data); } catch (x) {}
  wait.querySelector(".show").onclick = () => { try { w.focus(); } catch (x) {} };
  wait.querySelector(".stop").onclick = () => { try { w.close(); } catch (x) {} end(); };
  // 自己把小视窗关掉：页面回复原样（讯息晚一点到也照样处理）
  const timer = setInterval(() => {
    if (!done && w.closed) setTimeout(() => !done && hideWait(), 1200);
  }, 500);
  return true;
}
// 「用 OPIS PRO 登录」：电脑开小视窗；手机（或小视窗被挡住）播放冲进去的动画，再在同一个分页打开 OPIS PRO
function ssoGo(e) {
  if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return; // 自己要开新分页：照浏览器的
  e.preventDefault();
  const stage = document.getElementById("stage");
  if (stage.classList.contains("leaving") || document.querySelector(".sso-wait")) return;
  const href = e.currentTarget.href;
  if (ssoWindow(href)) return; // 电脑：小视窗
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return location.assign(href);
  stage.classList.add("leaving");
  document.getElementById("warp").classList.add("on");
  setTimeout(() => location.assign(href), 760);
}
// 从 OPIS PRO 按「上一页」回来（浏览器直接拿出旧画面）：回复原样
window.addEventListener("pageshow", (e) => {
  if (!e.persisted) return;
  document.getElementById("stage").classList.remove("leaving");
  document.getElementById("warp").classList.remove("on");
});
const SSO_ERRORS = { sso_cancelled: "ssoCancelled", sso_failed: "ssoFailed", sso_expired: "ssoExpired", sso_unreachable: "ssoUnreachable", sso_not_ready: "ssoNotReady", disabled: "disabled", pending: "pending", no_access: "noAccess", link_expired: "linkExpired" };
// ok = true 绿色；ok = "warn" 黄橘色（例如：等待批准）；其他 红色
const message = (text, ok) =>
  text ? `<div class="rounded-lg border px-3 py-2 text-sm ${ok === "warn" ? "border-amber-300 bg-amber-50 text-amber-800" : ok ? "border-emerald-200 bg-emerald-50 text-emerald-800" : "border-red-200 bg-red-50 text-red-700"}">${esc(text)}</div>` : "";

// 登录页只有「用 OPIS PRO 登录」。Email + 密码只在 login.html?mode=password（备用：OPIS PRO 连不上时给管理员用）
const PASSWORD_MODE = params.get("mode") === "password";
function showLogin(errorText, tone) {
  const sso = `<a class="sso" id="sso" href="${esc(GW_CONFIG.supabaseUrl + "/functions/v1/gw-opispro/start?next=" + encodeURIComponent(nextPage()) + "&site=" + encodeURIComponent(location.origin + location.pathname))}">${esc(t("login.sso"))}</a>`;
  if (!PASSWORD_MODE) {
    card.innerHTML = `<div class="space-y-4"><div id="msg"${errorText ? "" : " hidden"}>${message(errorText, tone)}</div>${sso}</div>`;
    $("#sso").addEventListener("click", ssoGo);
    return;
  }
  card.innerHTML = `
    <form id="f" class="space-y-4">
      <div id="msg">${message(errorText, tone)}</div>
      ${sso}
      <div class="or">${esc(t("login.or"))}</div>
      ${field(t("login.email"), `<input name="email" type="email" autocomplete="username" required inputmode="email">`)}
      ${field(t("login.password"), `<input name="password" type="password" autocomplete="current-password" required>`)}
      <button type="submit" class="go">${esc(t("login.submit"))}</button>
      <div class="text-center"><button type="button" class="link" id="forgot">${esc(t("login.forgot"))}</button></div>
    </form>`;
  $("#forgot").onclick = showForgot;
  $("#sso").addEventListener("click", ssoGo);
  $("#f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = new FormData(e.target);
    const email = String(form.get("email") || "").trim().toLowerCase();
    const submit = e.target.querySelector(".go");
    submit.disabled = true;
    submit.textContent = t("login.submitting");
    const r = await invoke("gw-auth", { action: "login", email, password: String(form.get("password") || "") });
    if (r && r.session) {
      const { error } = await sb.auth.setSession(r.session);
      if (!error) {
        try { localStorage.removeItem("gw-sso"); } catch (e) {}
        try { sessionStorage.setItem("gw-welcome", "1"); } catch (e) {}
        return go(r.must_change_password ? "login.html?mode=change" : nextPage());
      }
    }
    const err = (r && r.error) || "unknown";
    const msg =
      err === "invalid" ? t("login.errors.invalid")
      : err === "disabled" ? t("login.errors.disabled")
      : err === "no_access" ? t("login.errors.noAccess")
      : t("login.errors.unknown");
    $("#msg").innerHTML = message(msg);
    submit.disabled = false;
    submit.textContent = t("login.submit");
  });
}

function showForgot() {
  card.innerHTML = `
    <form id="f" class="space-y-4">
      <div>
        <h2 class="text-base font-semibold" style="color:var(--frame)">${esc(t("forgot.title"))}</h2>
        <p class="mt-1 text-sm text-slate-500">${esc(t("forgot.description"))}</p>
      </div>
      <div id="msg"></div>
      ${field(t("forgot.email"), `<input name="email" type="email" required inputmode="email">`)}
      <button type="submit" class="go">${esc(t("forgot.submit"))}</button>
      <div class="text-center"><button type="button" class="link" id="back">${esc(t("forgot.back"))}</button></div>
    </form>`;
  $("#back").onclick = () => showLogin();
  $("#f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = String(new FormData(e.target).get("email") || "").trim().toLowerCase();
    e.target.querySelector(".go").disabled = true;
    const redirectTo = new URL("login.html?mode=reset", location.href).href;
    if (email) await sb.auth.resetPasswordForEmail(email, { redirectTo });
    // 不论 email 是否存在都显示相同结果，避免泄漏帐号
    $("#msg").innerHTML = message(t("forgot.sent"), true);
  });
}

async function showChange(reset) {
  const { session, profile } = await GW.loadProfile();
  if (!session) return showLogin(reset ? t("login.errors.linkExpired") : "");
  if (!profile || profile.status !== "active") {
    await sb.auth.signOut();
    return showLogin(t("login.errors.noAccess"));
  }
  card.innerHTML = `
    <form id="f" class="space-y-4">
      <div>
        <h2 class="text-base font-semibold" style="color:var(--frame)">${esc(t(reset ? "password.resetTitle" : "password.forcedTitle"))}</h2>
        <p class="mt-1 text-sm text-slate-500">${esc(t(reset ? "password.resetDescription" : "password.forcedDescription"))}</p>
      </div>
      <div id="msg"></div>
      ${field(t("password.new"), `<input name="password" type="password" autocomplete="new-password" required minlength="8">`)}
      <p class="-mt-2 text-xs text-slate-500">${esc(t("password.rule"))}</p>
      ${field(t("password.confirm"), `<input name="confirm" type="password" autocomplete="new-password" required minlength="8">`)}
      <button type="submit" class="go">${esc(t("password.submit"))}</button>
    </form>`;
  $("#f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = new FormData(e.target);
    const error = await GW.changePassword(String(form.get("password") || ""), String(form.get("confirm") || ""));
    if (error) return ($("#msg").innerHTML = message(t("password.errors." + error)));
    go("index.html");
  });
}

(async function main() {
  const mode = params.get("mode");
  const error = params.get("error");
  if (mode === "change" || mode === "reset") {
    // 从重设密码邮件回来：等 Supabase 用网址里的 code 换好 session
    if (mode === "reset") await new Promise((r) => setTimeout(r, 300));
    return showChange(mode === "reset");
  }
  if (mode === "forgot") return showForgot();
  if (mode === "sso") return finishSso();
  if (POPUP_ID) return popupDone({ error: error || "sso_failed" }); // 小视窗里收到错误：告诉原本的页面，然后关掉
  // 已登录就直接进首页
  const { session, profile } = await GW.loadProfile();
  if (session && profile && profile.status === "active" && !error) {
    return go(profile.must_change_password ? "login.html?mode=change" : "index.html");
  }
  showLogin(SSO_ERRORS[error] ? t("login.errors." + SSO_ERRORS[error]) : "", error === "pending" ? "warn" : undefined);
})();
</script>
</body>
</html>
