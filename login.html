<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>MJM Intranet</title>
<script src="shared/head.js?v=__GW_VERSION__"></script>
<style>
  /* 登录封面：白底，MJM 字标（assets/mjm-logo）。
     进页面：字标从很远的地方（很小、模糊）加速冲到前面，接着出现白色玻璃方框。
     按「用 OPIS PRO 登录」：方框退下 → 字标冲到眼前盖满整个画面 → 深色画面上白色 MJM 往后飞远 → 同一个分页打开 OPIS PRO。 */
  :root { --frame: #1f2933; --frame-deep: #0f172a; }
  html, body { background: #ffffff !important; color: #0f172a; }
  body { overflow-x: hidden; }
  .stage {
    min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6vh 16px;
    background: radial-gradient(ellipse 70% 45% at 50% 38%, #f3f5f8 0%, #ffffff 70%);
  }

  /* MJM 字标图档（背景透明） */
  .logo { position: relative; z-index: 3; display: block; width: min(64vw, 490px); margin: -17px 0 -21px; opacity: 0; transform: scale(.02); will-change: transform, opacity, filter; }
  .logo img { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
  /* 从远处：一开始很慢（远），越来越快冲过来，稍微冲过头再停好 */
  @keyframes approach {
    0% { opacity: 0; transform: scale(.02); filter: blur(6px); animation-timing-function: cubic-bezier(.7, 0, .84, .3); }
    14% { opacity: .85; }
    80% { opacity: 1; transform: scale(1.08); filter: blur(0); animation-timing-function: cubic-bezier(.2, .8, .3, 1); }
    100% { opacity: 1; transform: scale(1); filter: blur(0); }
  }
  .ready .logo { animation: approach 1.15s forwards; }
  /* 登录：冲到眼前（以 J 为中心放大） */
  @keyframes rush { from { opacity: 1; transform: scale(1); filter: blur(0); } to { opacity: 1; transform: scale(30); filter: blur(3px); } }
  .leaving .logo { transform-origin: 52% 42%; animation: rush .7s cubic-bezier(.55, 0, .9, .25) forwards; }
  .stage.leaving .rule { opacity: 0; transition: opacity .2s; }
  .stage.leaving .glass { opacity: 0; transform: translateY(46px) scale(.94); transition: opacity .25s, transform .35s ease-in; }
  /* 盖满画面的深色 + 往后飞远的白色 MJM */
  .warp {
    position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at 50% 50%, #2b3641 0%, #0f172a 72%);
  }
  .warp.on { opacity: 1; transition: opacity .3s ease-in .4s; }
  .warp-logo { width: min(64vw, 490px); opacity: 0; }
  .warp-logo img { display: block; width: 100%; height: auto; filter: brightness(0) invert(1) drop-shadow(0 0 28px rgba(255, 255, 255, .35)); }
  @keyframes recede {
    0% { opacity: 0; transform: scale(2.6); filter: blur(4px); }
    22% { opacity: .95; filter: blur(0); }
    100% { opacity: 0; transform: scale(.03); filter: blur(1px); }
  }
  .warp.on .warp-logo { animation: recede .6s cubic-bezier(.4, 0, .9, .45) .62s forwards; }
  .rule { width: clamp(120px, 28vw, 260px); height: 1px; margin: 18px 0 0; background: linear-gradient(90deg, transparent, #9aa4ae, transparent); opacity: 0; transition: opacity .6s 1.1s; }
  .ready .rule { opacity: 1; }

  /* 白色玻璃方框 */
  .glass {
    position: relative; z-index: 2; width: min(92vw, 360px); margin-top: 22px;
    padding: 24px 24px 20px; border-radius: 22px;
    background: linear-gradient(180deg, rgba(255, 255, 255, .78), rgba(255, 255, 255, .58));
    -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid rgba(255, 255, 255, .95);
    box-shadow: 0 1px 0 #ffffff inset, 0 0 0 1px rgba(148, 160, 172, .25), 0 24px 50px rgba(15, 23, 42, .12);
    opacity: 0; transform: translateY(24px) scale(.97);
    transition: opacity .6s, transform .7s cubic-bezier(.2, .8, .2, 1);
  }
  .show-glass .glass { opacity: 1; transform: none; }
  .brand { text-align: center; font-size: 11px; font-weight: 700; letter-spacing: .55em; text-indent: .55em; color: #64707c; margin-bottom: 18px; }
  .glass label > span { display: block; font-size: 12px; font-weight: 600; color: #334155; margin-bottom: 6px; }
  .glass input {
    width: 100%; height: 44px; border-radius: 12px; border: 1px solid rgba(15, 23, 42, .14); background: rgba(255, 255, 255, .9);
    padding: 0 14px; font-size: 15px; color: #0f172a; outline: none; transition: border-color .2s, box-shadow .2s;
  }
  .glass input:focus { border-color: #64707c; box-shadow: 0 0 0 3px rgba(100, 112, 124, .18); }
  .glass .go {
    width: 100%; height: 46px; border: 0; border-radius: 12px; cursor: pointer; color: #fff; font-weight: 600; font-size: 15px; letter-spacing: .02em;
    background: linear-gradient(180deg, #3a4651, #1f2933); box-shadow: 0 1px 0 rgba(255, 255, 255, .18) inset, 0 6px 14px rgba(15, 23, 42, .2);
    transition: filter .2s;
  }
  .glass .go:hover { filter: brightness(1.12); }
  .glass .go:disabled { opacity: .7; cursor: default; }
  .glass .link { font-size: 13px; color: #475569; background: none; border: 0; cursor: pointer; }
  .glass .link:hover { text-decoration: underline; text-underline-offset: 3px; }
  .glass .sso {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 46px; border-radius: 12px; text-decoration: none;
    font-weight: 600; font-size: 15px; color: #0f172a; background: rgba(255, 255, 255, .92); border: 1px solid rgba(15, 23, 42, .16);
    box-shadow: 0 1px 2px rgba(15, 23, 42, .06); transition: border-color .2s, box-shadow .2s, transform .15s;
  }
  .glass .sso:hover { border-color: #64707c; box-shadow: 0 6px 14px rgba(15, 23, 42, .12); transform: translateY(-1px); }
  .glass .sso:active { transform: none; }
  .glass .or { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #94a3b8; }
  .glass .or::before, .glass .or::after { content: ""; flex: 1; height: 1px; background: rgba(15, 23, 42, .12); }

  @media (prefers-reduced-motion: reduce) {
    .logo { opacity: 1; transform: none; }
    .ready .logo, .leaving .logo, .warp.on .warp-logo { animation: none; }
    .glass, .rule { transition: none; }
  }
</style>
</head>
<body>
<main class="stage" id="stage">
  <picture class="logo">
    <source srcset="assets/mjm-logo.webp" type="image/webp">
    <img src="assets/mjm-logo.png" alt="MJM" width="1333" height="628" draggable="false">
  </picture>
  <div class="rule"></div>
  <div class="glass" id="glass">
    <div class="brand">CONNECT</div>
    <div id="card"></div>
  </div>
</main>
<div class="warp" id="warp" aria-hidden="true">
  <picture class="warp-logo">
    <source srcset="assets/mjm-logo.webp" type="image/webp">
    <img src="assets/mjm-logo.png" alt="" width="1333" height="628" draggable="false">
  </picture>
</div>

<script>
/* 字标图片载入后才开始飞进来；载入失败也照常显示 */
(function () {
  const stage = document.getElementById("stage");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const start = () => {
    requestAnimationFrame(() => stage.classList.add("ready"));
    setTimeout(() => stage.classList.add("show-glass"), reduce ? 0 : 1050);
  };
  const img = document.querySelector(".logo img");
  const loaded = img.complete ? Promise.resolve() : new Promise((r) => img.addEventListener("load", r, { once: true }));
  Promise.race([loaded, new Promise((r) => setTimeout(r, 1500))]).then(start, start);
})();
</script>

<script>
/* ---------------------------------------------------------------- 登录 / 忘记密码 / 改密码 */
const { sb, t, esc, $, invoke, go } = GW;
document.documentElement.classList.remove("dark"); // 封面固定白底
const params = new URLSearchParams(location.search);
const card = $("#card");

const field = (label, input) => `<label class="block"><span>${esc(label)}</span>${input}</label>`;
// 登入后要去的页面：只接受 Intranet 自己的页面
const nextPage = () => {
  const n = params.get("next") || "";
  return /^[a-z0-9-]+\.html(\?[\w=&.%-]*)?(#[\w-]*)?$/.test(n) && !n.startsWith("login.html") ? n : "index.html";
};
// OPIS PRO 回来：用一次性登录码换 session（码在 # 后面，先从网址拿掉）
async function finishSso() {
  const h = new URLSearchParams(location.hash.slice(1));
  const th = h.get("th");
  const next = h.get("next");
  history.replaceState(null, "", location.pathname);
  const failed = () => showLogin(t("login.errors.ssoExpired"));
  if (!th) return failed();
  card.innerHTML = `<p class="py-6 text-center text-sm text-slate-500">${esc(t("login.submitting"))}</p>`;
  let r = await sb.auth.verifyOtp({ token_hash: th, type: "magiclink" });
  if (r.error) r = await sb.auth.verifyOtp({ token_hash: th, type: "email" });
  if (r.error || !r.data || !r.data.session) return failed();
  try { localStorage.setItem("gw-sso", r.data.session.user.id); } catch (e) {}
  if (next) params.set("next", next);
  go(nextPage());
}
// 「用 OPIS PRO 登录」：先播放冲进去的动画，再在同一个分页打开 OPIS PRO
function ssoGo(e) {
  if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return; // 自己要开新分页：照浏览器的
  e.preventDefault();
  const stage = document.getElementById("stage");
  if (stage.classList.contains("leaving")) return;
  const href = e.currentTarget.href;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return location.assign(href);
  stage.classList.add("leaving");
  document.getElementById("warp").classList.add("on");
  setTimeout(() => location.assign(href), 1200);
}
// 从 OPIS PRO 按「上一页」回来（浏览器直接拿出旧画面）：回复原样
window.addEventListener("pageshow", (e) => {
  if (!e.persisted) return;
  document.getElementById("stage").classList.remove("leaving");
  document.getElementById("warp").classList.remove("on");
});
const SSO_ERRORS = { sso_cancelled: "ssoCancelled", sso_failed: "ssoFailed", sso_expired: "ssoExpired", sso_unreachable: "ssoUnreachable", sso_not_ready: "ssoNotReady", disabled: "disabled", no_access: "noAccess", link_expired: "linkExpired" };
const message = (text, ok) =>
  text ? `<div class="rounded-lg border px-3 py-2 text-sm ${ok ? "border-emerald-200 bg-emerald-50 text-emerald-800" : "border-red-200 bg-red-50 text-red-700"}">${esc(text)}</div>` : "";

// 登录页只有「用 OPIS PRO 登录」。Email + 密码只在 login.html?mode=password（备用：OPIS PRO 连不上时给管理员用）
const PASSWORD_MODE = params.get("mode") === "password";
function showLogin(errorText) {
  const sso = `<a class="sso" id="sso" href="${esc(GW_CONFIG.supabaseUrl + "/functions/v1/gw-opispro/start?next=" + encodeURIComponent(nextPage()))}">${esc(t("login.sso"))}</a>`;
  if (!PASSWORD_MODE) {
    card.innerHTML = `<div class="space-y-4"><div id="msg">${message(errorText)}</div>${sso}</div>`;
    $("#sso").addEventListener("click", ssoGo);
    return;
  }
  card.innerHTML = `
    <form id="f" class="space-y-4">
      <div id="msg">${message(errorText)}</div>
      ${sso}
      <div class="or">${esc(t("login.or"))}</div>
      ${field(t("login.email"), `<input name="email" type="email" autocomplete="username" required inputmode="email">`)}
      ${field(t("login.password"), `<input name="password" type="password" autocomplete="current-password" required>`)}
      <button type="submit" class="go">${esc(t("login.submit"))}</button>
      <div class="text-center"><button type="button" class="link" id="forgot">${esc(t("login.forgot"))}</button></div>
    </form>`;
  $("#forgot").onclick = showForgot;
  $("#sso").addEventListener("click", ssoGo);
  $("#f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = new FormData(e.target);
    const email = String(form.get("email") || "").trim().toLowerCase();
    const submit = e.target.querySelector(".go");
    submit.disabled = true;
    submit.textContent = t("login.submitting");
    const r = await invoke("gw-auth", { action: "login", email, password: String(form.get("password") || "") });
    if (r && r.session) {
      const { error } = await sb.auth.setSession(r.session);
      if (!error) {
        try { localStorage.removeItem("gw-sso"); } catch (e) {}
        return go(r.must_change_password ? "login.html?mode=change" : nextPage());
      }
    }
    const err = (r && r.error) || "unknown";
    const msg =
      err === "invalid" ? t("login.errors.invalid")
      : err === "disabled" ? t("login.errors.disabled")
      : err === "no_access" ? t("login.errors.noAccess")
      : t("login.errors.unknown");
    $("#msg").innerHTML = message(msg);
    submit.disabled = false;
    submit.textContent = t("login.submit");
  });
}

function showForgot() {
  card.innerHTML = `
    <form id="f" class="space-y-4">
      <div>
        <h2 class="text-base font-semibold" style="color:var(--frame)">${esc(t("forgot.title"))}</h2>
        <p class="mt-1 text-sm text-slate-500">${esc(t("forgot.description"))}</p>
      </div>
      <div id="msg"></div>
      ${field(t("forgot.email"), `<input name="email" type="email" required inputmode="email">`)}
      <button type="submit" class="go">${esc(t("forgot.submit"))}</button>
      <div class="text-center"><button type="button" class="link" id="back">${esc(t("forgot.back"))}</button></div>
    </form>`;
  $("#back").onclick = () => showLogin();
  $("#f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = String(new FormData(e.target).get("email") || "").trim().toLowerCase();
    e.target.querySelector(".go").disabled = true;
    const redirectTo = new URL("login.html?mode=reset", location.href).href;
    if (email) await sb.auth.resetPasswordForEmail(email, { redirectTo });
    // 不论 email 是否存在都显示相同结果，避免泄漏帐号
    $("#msg").innerHTML = message(t("forgot.sent"), true);
  });
}

async function showChange(reset) {
  const { session, profile } = await GW.loadProfile();
  if (!session) return showLogin(reset ? t("login.errors.linkExpired") : "");
  if (!profile || profile.status !== "active") {
    await sb.auth.signOut();
    return showLogin(t("login.errors.noAccess"));
  }
  card.innerHTML = `
    <form id="f" class="space-y-4">
      <div>
        <h2 class="text-base font-semibold" style="color:var(--frame)">${esc(t(reset ? "password.resetTitle" : "password.forcedTitle"))}</h2>
        <p class="mt-1 text-sm text-slate-500">${esc(t(reset ? "password.resetDescription" : "password.forcedDescription"))}</p>
      </div>
      <div id="msg"></div>
      ${field(t("password.new"), `<input name="password" type="password" autocomplete="new-password" required minlength="8">`)}
      <p class="-mt-2 text-xs text-slate-500">${esc(t("password.rule"))}</p>
      ${field(t("password.confirm"), `<input name="confirm" type="password" autocomplete="new-password" required minlength="8">`)}
      <button type="submit" class="go">${esc(t("password.submit"))}</button>
    </form>`;
  $("#f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = new FormData(e.target);
    const error = await GW.changePassword(String(form.get("password") || ""), String(form.get("confirm") || ""));
    if (error) return ($("#msg").innerHTML = message(t("password.errors." + error)));
    go("index.html");
  });
}

(async function main() {
  const mode = params.get("mode");
  const error = params.get("error");
  if (mode === "change" || mode === "reset") {
    // 从重设密码邮件回来：等 Supabase 用网址里的 code 换好 session
    if (mode === "reset") await new Promise((r) => setTimeout(r, 300));
    return showChange(mode === "reset");
  }
  if (mode === "forgot") return showForgot();
  if (mode === "sso") return finishSso();
  // 已登录就直接进首页
  const { session, profile } = await GW.loadProfile();
  if (session && profile && profile.status === "active" && !error) {
    return go(profile.must_change_password ? "login.html?mode=change" : "index.html");
  }
  showLogin(SSO_ERRORS[error] ? t("login.errors." + SSO_ERRORS[error]) : "");
})();
</script>
</body>
</html>
